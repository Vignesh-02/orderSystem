name: CI/CD Pipeline

on:
  push:
    branch:
      - main
      - develop

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1

jobs:
  
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS (Dev)
        id: deploy
        run: |
          npx serverless deploy --stage dev --verbose
          API_URL=$(npx serverless info --stage dev | grep -oP 'https://[^\s]+' | head -1 || echo "")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployment completed. API URL: $API_URL"

      - name: Output deployment info
        run: |
          echo "Deployment Summary:"
          npx serverless info --stage dev || true

  

